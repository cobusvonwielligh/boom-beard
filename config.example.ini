; Boom Beard configuration template.
;
; Copy to config.ini (which is gitignored) and edit. Nothing here is needed for local
; development - `npm start` works with no config file at all.
;
; Every value can be overridden by an environment variable of the same name in upper case,
; e.g. LAG=200 npm start. Environment always wins over this file.

[server]
; Region ID for /region-status: za serves the website/admin; us is game-only at its EIP.
region_id    = za
; 8080 locally, 443 in production.
port         = 8080
; Plain-HTTP listener used only for the HTTPS redirect and certificate renewal.
redirect_port = 80
; Used for redirect targets and logging. Can be a hostname or the US Elastic IP.
public_host  = localhost
; Leave both blank for plain HTTP. Set both to serve HTTPS directly.
tls_cert     =
tls_key      =
; Where leaderboard.json and the certificate copies live.
data_dir     = ./data
max_players  = 16
; Do names need a password? 1 (the default) means a name is claimed once with a password and then
; needs either that password or a token the server issued to the browser - which is what stops
; anybody typing your name and inheriting your career, since the leaderboard is keyed by name.
; 0 turns it off entirely: right for a LAN party or a demo, wrong for anything on the internet.
; Accounts live in <data_dir>/accounts.json, mode 0600. See docs/ANTICHEAT.md.
require_password = 1
; Seconds of frozen count-in at the top of every round: the timer in the middle of the board, with
; nobody - people or bots - able to move until it reaches zero. The round clock is pushed out by
; the same amount, so a ten-minute round is still ten minutes of play. 0 starts the round live.
count_in = 5
; Bot target. ZA removes bots after two empty rounds; US keeps its complement while idle.
; Built-in fallback is 5 for ZA and 4 for US; this example explicitly overrides it with 6.
min_bots     = 6

[deploy]
; Shared secret for POST /deploy, used by the GitHub Actions deploy workflow.
; Generate with:  openssl rand -hex 32
; Blank disables the endpoint completely - that is the correct setting for a laptop.
token    =
; Used by infra/deploy.sh when pushing from a laptop.
ssh_host = your.server.example
ssh_user = ec2-user
ssh_key  = ~/.ssh/your-key.pem

[deploy_us]
; Second target for `npm run deploy`; it uses the same working tree as ZA.
ssh_host = 52.21.210.27
ssh_user = ec2-user
ssh_key  = ~/Downloads/bombs-away-na.pem

[shared]
; Server-to-server secret used by the US game instance to access the ZA player-data authority.
; Generate once on ZA, then install the exact same value on US. Never expose it to browser code.
token =
; US connects to this fixed ZA IP while validating the ZA certificate using servername.
host = 15.240.88.189
servername = boombeard.co.za

[admin]
; Whoever's browser presents this key is always host. Open https://<host>/?admin=<key> once and
; the browser keeps it. Generate with:  openssl rand -hex 16
; Blank falls back to the name below, which anyone can type - fine on a laptop, not on a server.
key  =
name = cobusvw
; Second factor for /admin. Keep blank to disable the dashboard. Set this only on the server
; through ADMIN_DASHBOARD_PASSWORD or the ignored config.ini; never put the real value in git.
dashboard_password =

[dev]
; Outbound delay in milliseconds, to develop against a realistic connection.
; The server refuses to start if either is non-zero while TLS is configured.
lag    = 0
jitter = 0
